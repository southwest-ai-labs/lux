name: Release

# Builds the Linux bundle from a version tag and attaches it to the GitHub
# release for that tag. Re-run for an existing tag with
# workflow_dispatch; the tag itself is never moved.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (for example v0.6.1)'
        required: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.32.0'

jobs:
  linux:
    name: Linux bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release bundle
        run: flutter build linux --release

      - name: Package
        env:
          TAG_IN: ${{ inputs.tag || github.ref_name }}
        run: |
          TAG="${TAG_IN}"
          VERSION="${TAG#v}"
          tar -C build/linux/x64/release/bundle -czf "lux-${VERSION}-linux-x64.tar.gz" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: lux-*-linux-x64.tar.gz
          if-no-files-found: error

  publish:
    name: Attach bundles to the release
    needs: [linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --title "Lux $VERSION" \
              --notes "Lux $VERSION. Linux bundle built by the Release workflow."
          fi
          gh release upload "$TAG" bundles/* --repo "$REPO" --clobber
          gh release view "$TAG" --repo "$REPO" --json url,assets --jq '.url, (.assets[].name)'
