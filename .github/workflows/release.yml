name: Release

# Builds the Linux and Windows bundles from a version tag and attaches them to
# the GitHub release for that tag. Re-run for an existing tag with
# workflow_dispatch; the tag itself is never moved.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (for example v0.6.1)'
        required: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.32.0'

jobs:
  linux:
    name: Linux bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release bundle
        run: flutter build linux --release

      - name: Package
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          tar -C build/linux/x64/release/bundle -czf "lux-${VERSION}-linux-x64.tar.gz" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: lux-*-linux-x64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows bundle
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install dependencies
        run: flutter pub get

      - name: Build release bundle
        run: flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          $tag = if ("${{ inputs.tag }}" -ne "") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $version = $tag.TrimStart('v')
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "lux-$version-windows-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: lux-*-windows-x64.zip
          if-no-files-found: error

  publish:
    name: Attach bundles to the release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "Lux $VERSION" \
              --notes "Lux $VERSION. Linux and Windows bundles built by the Release workflow."
          fi
          gh release upload "$TAG" bundles/* --clobber
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[].name)'
