publish_to: 'none'
version: 0.4.1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  tray_manager: ^0.5.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
